# 30分ごとに YouTube から最新の動画を集め、対象試合を選んでサイトを公開し直す。
# 7時・11時・16時(日本時間)を過ぎたら、前回以降の新着をまとめて通知する。
name: update

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'テスト通知を1通送る'
        type: boolean
        default: false

permissions:
  contents: write # 通知の記録(state/notify.json)を保存するため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: YouTubeから3社の動画一覧を取得
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-youtube.mjs data/videos.json
      - name: 対象試合を選んでサイト用データを作る
        run: node scripts/build.mjs data/videos.json
      - name: 一覧の動画のコメントを取得(新しい動画ほどこまめに)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-comments.mjs
      - name: AI点検用のリストを保存
        uses: actions/upload-artifact@v7
        with:
          name: review
          path: review.json
          retention-days: 7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: 通知(7時・11時・16時)
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          NOTIFY_TEST: ${{ github.event.inputs.test }}
        run: node scripts/notify.mjs
      - name: 通知の記録を保存
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -q -m "通知の記録を更新"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
