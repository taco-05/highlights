# 30分ごとに YouTube から最新の動画を集め、対象試合を選んでサイトを公開し直す
name: update

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: YouTubeから3社の動画一覧を取得
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-youtube.mjs data/videos.json
      - name: 対象試合を選んでサイト用データを作る
        run: node scripts/build.mjs data/videos.json
      - name: AI点検用のリストを保存
        uses: actions/upload-artifact@v4
        with:
          name: review
          path: review.json
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
