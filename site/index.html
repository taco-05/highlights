<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content=".Highlight">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<!-- 見出し「.Highlight」用の書体(Montserrat。使う文字だけ読み込む) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&text=.Highlight&display=swap">
<title>.Highlight</title>
<style>
  :root {
    --bg: #edf0f4; --surface: #ffffff; --text: #111827; --muted: #6b7280; --line: #e0e4ea;
    --accent: #0f766e; --accent-ink: #ffffff; --chip: #e4e9ef; --dot: #ef4444; --sheet-shade: rgba(0,0,0,.45);
    --jp-bg: #fff1f2; --jp-ink: #be123c; --bar: rgba(237, 240, 244, .92);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1720; --surface: #1c2734; --text: #e5e7eb; --muted: #94a3b8; --line: #2a394a;
      --accent: #2dd4bf; --accent-ink: #062b27; --chip: #223040; --dot: #f87171; --sheet-shade: rgba(0,0,0,.6);
      --jp-bg: #3b1520; --jp-ink: #fda4af; --bar: rgba(15, 23, 32, .92);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1720; --surface: #1c2734; --text: #e5e7eb; --muted: #94a3b8; --line: #2a394a;
    --accent: #2dd4bf; --accent-ink: #062b27; --chip: #223040; --dot: #f87171; --sheet-shade: rgba(0,0,0,.6);
    --jp-bg: #3b1520; --jp-ink: #fda4af; --bar: rgba(15, 23, 32, .92);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-text-size-adjust: 100%; }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom: 1px solid var(--line);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 24px; line-height: 1; margin: 0; font-weight: 900; letter-spacing: -.035em; font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  /* 「未視聴のみ」のスイッチ(iPhoneの設定画面のような切り替え) */
  .switch { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); user-select: none; -webkit-user-select: none; cursor: pointer; }
  .switch input {
    -webkit-appearance: none; appearance: none; margin: 0; flex: none; position: relative; cursor: pointer;
    width: 36px; height: 22px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); transition: background .15s, border-color .15s;
  }
  .switch input::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.35); transition: transform .15s;
  }
  .switch input:checked { background: var(--accent); border-color: var(--accent); }
  .switch input:checked::after { transform: translateX(14px); }
  /* 絞り込みボタンは親指で押しやすいよう画面の下に固定 */
  .chips {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px);
    background: var(--bar); border-top: 1px solid var(--line);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 0; border-radius: 999px; padding: 7px 12px; font-size: 14px;
    background: var(--chip); color: var(--text); cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  main { padding: 8px 16px calc(env(safe-area-inset-bottom) + 24px); max-width: 1100px; margin: 0 auto; }
  h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 14px 2px 6px; }
  .grid { display: grid; gap: 6px; grid-template-columns: 1fr; }
  @media (min-width: 700px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1000px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
  /* 一覧のカード: 左にチーム名2行、右の細い列に大会と節。1画面に多く並ぶよう詰めている */
  .card {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; align-items: start;
    width: 100%; text-align: left; font: inherit; color: inherit;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; cursor: pointer;
  }
  /* 見た試合は中身だけ薄くする(カードの背景は不透明のままにして、後ろのスワイプ用の帯が透けないように) */
  .card.watched > * { opacity: .5; }
  .team { display: flex; align-items: center; gap: 8px; height: 24px; min-width: 0; }
  .team + .team { margin-top: 2px; }
  .badge {
    flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    font-size: 7px; font-weight: 800; letter-spacing: -.03em; border: 2px solid transparent;
  }
  .team-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side { font-size: 11px; line-height: 1.45; color: var(--muted); text-align: right; max-width: 96px; padding-top: 2px; }
  .side .comp { display: flex; align-items: center; justify-content: flex-end; gap: 5px; white-space: nowrap; }
  .new-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--dot); }
  .jp { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 3px 10px; margin-top: 5px; }
  /* 日本人選手の出場ラベル(JPN + 名前) */
  .jpn { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text); }
  .jpn b, .jpn-mini {
    font-size: 9px; font-weight: 700; letter-spacing: .06em; line-height: 1; padding: 2px 3px 1px;
    border-radius: 3px; border: 1px solid var(--jp-ink); color: var(--jp-ink);
  }
  .chip .jpn-mini { margin-right: 4px; vertical-align: 1px; }
  .chip[aria-pressed="true"] .jpn-mini { border-color: currentColor; color: inherit; }
  .sheet .team { height: 30px; }
  .sheet .team-name { font-size: 16px; }
  .sheet .jp { margin-top: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  /* 下の絞り込みボタンに最後の試合が隠れないよう、そのぶん余白をとる */
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 16px 16px calc(env(safe-area-inset-bottom) + 72px); }

  /* 再生シート */
  .sheet-wrap { position: fixed; inset: 0; background: var(--sheet-shade); display: none; z-index: 20; align-items: flex-end; justify-content: center; }
  .sheet-wrap.open { display: flex; }
  .sheet {
    width: 100%; max-width: 760px; background: var(--surface); border-radius: 18px 18px 0 0;
    padding: 14px 16px calc(env(safe-area-inset-bottom) + 16px); max-height: 92vh; overflow: auto;
  }
  @media (min-width: 700px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 18px; } }
  /* 試合の画面は最初から最終的な高さで開く(コメントを開いても画面が上に動かず、中で下に伸びる) */
  .sheet.tall { height: 92vh; height: 92dvh; }
  @media (min-width: 700px) { .sheet.tall { height: min(92vh, 860px); } }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .icon-btn { border: 0; background: var(--chip); color: var(--text); border-radius: 999px; padding: 7px 12px; font-size: 14px; cursor: pointer; }
  /* 動画は画面の上に固定し、その下(チーム名・コメント)だけがスクロールする */
  .player-wrap { position: sticky; top: -14px; z-index: 3; background: var(--surface); margin: 0 -16px; padding: 0 16px 10px; }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000; }
  .player iframe, .player > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* 再生前・再生後はプレイヤーを見せない(サムネイルやおすすめ動画のネタバレ防止) */
  .yt-box { visibility: hidden; }
  .yt-box.on { visibility: visible; }
  .play-btn[hidden] { display: none; }
  .ts { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }
  /* 全画面専用のプレイヤーは画面の外に置いておく(再生すると全画面に切り替わる) */
  .yt-full { position: fixed; left: -10000px; top: 0; width: 320px; height: 180px; }
  .full-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 8px 14px; }
  /* 一覧のスワイプ */
  .swipe { position: relative; border-radius: 12px; overflow: hidden; }
  .swipe-bg {
    position: absolute; inset: 0; display: flex; align-items: center; padding: 0 18px; border-radius: 12px;
    background: var(--chip); color: var(--muted); font-size: 13px; font-weight: 700;
  }
  .swipe-bg.left { justify-content: flex-end; }
  .swipe-bg.ready { background: var(--accent); color: var(--accent-ink); }
  .swipe .card { position: relative; touch-action: pan-y; transition: transform .2s ease; }
  .swipe .card.dragging { transition: none; }
  h1 .dot { color: var(--accent); }
  /* 見出しの「H」はアイコンと同じ形(2本の縦棒+間に▶)。高さは書体の大文字と同じ0.7em */
  h1 .h-mark { height: .7em; width: auto; fill: currentColor; vertical-align: baseline; margin: 0 .06em 0 .02em; }
  h1 .h-mark .tri { fill: var(--accent); }
  .play-btn {
    position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; border: 0; cursor: pointer;
    background: linear-gradient(135deg, var(--home, #334155), var(--away, #0f172a)); color: #fff; font-size: 17px; font-weight: 700;
  }
  .play-btn span { background: rgba(0,0,0,.45); padding: 12px 22px; border-radius: 999px; }
  .sheet-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .src { font-size: 12px; color: var(--muted); }
  .title-actions { display: flex; align-items: center; gap: 10px; }
  .bell { border: 0; background: transparent; color: var(--muted); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .bell svg { fill: currentColor; }
  .bell:active { background: var(--chip); }
  /* 通知の設定 */
  .note { font-size: 14px; line-height: 1.6; color: var(--text); margin: 6px 0 12px; }
  .note.muted { color: var(--muted); font-size: 13px; }
  .steps { margin: 0 0 12px; padding-left: 1.4em; font-size: 14px; line-height: 1.8; }
  .primary { display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); cursor: pointer; margin: 8px 0; text-align: center; text-decoration: none; }
  .secondary { display: block; width: 100%; border: 0; border-radius: 12px; padding: 12px; font-size: 15px; background: var(--chip); color: var(--text); cursor: pointer; margin: 8px 0; text-align: center; text-decoration: none; }
  .code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; word-break: break-all; max-height: 96px; overflow: auto; user-select: all; -webkit-user-select: all; }
  .ok { color: var(--accent); font-weight: 700; }
  /* コメント */
  .comments { margin-top: 12px; }
  .comments > .secondary { margin: 0; }
  .cm-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 2px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
  .cm-meta { font-size: 11px; color: var(--muted); }
  .cm { padding: 10px 0; border-top: 1px solid var(--line); }
  .cm-head { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .cm-author { color: var(--text); font-weight: 600; }
  .cm-text { font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1 aria-label=".Highlight"><span class="dot">.</span><svg class="h-mark" viewBox="196 136 218 240" aria-hidden="true"><rect x="196" y="136" width="62" height="240"/><rect x="352" y="136" width="62" height="240"/><path class="tri" d="M258 196 L258 316 L352 256 Z"/></svg>ighlight</h1>
    <div class="title-actions">
      <label class="switch"><input type="checkbox" role="switch" id="unwatchedOnly">未視聴のみ</label>
      <button class="bell" data-act="notify" aria-label="通知の設定">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M12 2.8a6.2 6.2 0 0 0-6.2 6.2v4.1l-1.6 2.6a.9.9 0 0 0 .8 1.4h14a.9.9 0 0 0 .8-1.4l-1.6-2.6V9A6.2 6.2 0 0 0 12 2.8z"/>
          <path d="M9.6 18.6a2.4 2.4 0 0 0 4.8 0z"/>
        </svg>
      </button>
    </div>
  </div>
</header>
<main id="list"></main>
<footer id="footer"></footer>
<nav class="chips" id="chips" aria-label="絞り込み"></nav>

<div class="sheet-wrap" id="sheetWrap" role="dialog" aria-modal="true" aria-label="ハイライトを再生">
  <div class="sheet" id="sheet"></div>
</div>

<script>
  // 試合データは開くたびに最新を読む(ブラウザやGitHubに残った古いデータを使わない)
  document.write('<script src="data.js?t=' + Math.floor(Date.now() / 60000) + '"><\/script>');
</script>
<script src="push-config.js"></script>
<script>
(() => {
  const DATA = window.HIGHLIGHTS || { matches: [] };
  const FILTERS = [
    { id: 'all', label: 'すべて' },
    { id: 'jp', label: '<span class="jpn-mini">JPN</span>出場' },
    { id: 'premier', label: 'プレミア' },
    { id: 'laliga', label: 'ラ・リーガ' },
    { id: 'bundesliga', label: 'ブンデス' },
    { id: 'ligue1', label: 'リーグアン' },
    { id: 'seriea', label: 'セリエA' },
    { id: 'eredivisie', label: 'オランダ' },
    { id: 'portugal', label: 'ポルトガル' },
    { id: 'belgium', label: 'ベルギー' },
    { id: 'j1', label: 'J1' },
    { id: 'europe', label: '欧州カップ' },
    { id: 'cup', label: 'カップ戦' },
  ];

  // 端末ごとの「見た」記録(使えない環境でも動くように)
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const watched = new Set(store.get('watched', []));
  const saveWatched = () => store.set('watched', [...watched]);
  let filter = store.get('filter', 'all');
  const unwatchedBox = document.getElementById('unwatchedOnly');
  unwatchedBox.checked = store.get('unwatchedOnly', false);

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ink = (hex) => {
    const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? '#111' : '#fff';
  };
  const badge = (t) => {
    if (!t.colors) return `<span class="badge" style="background:var(--chip);color:var(--muted)">${esc(t.name.slice(0, 1))}</span>`;
    const [c1, c2] = t.colors;
    return `<span class="badge" style="background:${c1};color:${ink(c1)};border-color:${c2}">${esc(t.code)}</span>`;
  };
  // 公開された日ごとに分ける(今日/昨日/10月9日(木))
  const sectionOf = (iso) => {
    const d = new Date(iso);
    const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((day(new Date()) - day(d)) / 86400000);
    if (diff <= 0) return '今日';
    if (diff === 1) return '昨日';
    return `${d.getMonth() + 1}月${d.getDate()}日(${'日月火水木金土'[d.getDay()]})`;
  };

  function renderChips() {
    document.getElementById('chips').innerHTML = FILTERS.map((f) =>
      `<button class="chip" data-f="${f.id}" aria-pressed="${f.id === filter}">${f.label}</button>`).join('');
  }

  function visible() {
    return DATA.matches.filter((m) =>
      (filter === 'all' || (filter === 'jp' ? m.jp.length > 0 : m.group === filter)) &&
      (!unwatchedBox.checked || !watched.has(m.id)));
  }

  const jpLabels = (m) => m.jp.length
    ? `<div class="jp">${m.jp.map((n) => `<span class="jpn"><b>JPN</b>${esc(n)}</span>`).join('')}</div>` : '';

  // カードは左右にスワイプすると「見た/未視聴」を切り替えられる(下にあるのはスワイプ中に見える帯)
  function card(m) {
    const w = watched.has(m.id);
    return `<div class="swipe"><div class="swipe-bg"><span>${w ? '未視聴に戻す' : '見たことにする'}</span></div>
      <button class="card${w ? ' watched' : ''}" data-id="${m.id}">
      <div>
        <div class="team">${badge(m.home)}<span class="team-name">${esc(m.home.name)}</span></div>
        <div class="team">${badge(m.away)}<span class="team-name">${esc(m.away.name)}</span></div>
      </div>
      <div class="side">
        <div class="comp">${w ? '' : '<span class="new-dot" aria-label="未視聴"></span>'}${esc(m.compShort || m.comp)}</div>
        <div>${esc(m.round)}</div>
      </div>
      ${jpLabels(m)}
    </button></div>`;
  }

  function render() {
    const items = visible();
    const list = document.getElementById('list');
    if (!items.length) { list.innerHTML = '<p class="empty">表示できる試合はありません</p>'; return; }
    const groups = new Map();
    for (const m of items) {
      const s = sectionOf(m.publishedAt);
      if (!groups.has(s)) groups.set(s, []);
      groups.get(s).push(m);
    }
    list.innerHTML = [...groups].map(([s, ms]) =>
      `<h2>${s}(${ms.length})</h2><div class="grid">${ms.map(card).join('')}</div>`).join('');
  }

  // ---- 再生シート ----
  const wrap = document.getElementById('sheetWrap');
  const sheet = document.getElementById('sheet');
  let player = null;
  let openedAt = 0; // 開いた直後の二重タップで背景が押されて閉じるのを防ぐ

  function openSheet(m) {
    const [h1] = m.home.colors || ['#334155'];
    const [a1] = m.away.colors || ['#0f172a'];
    sheet.innerHTML = `
      <div class="sheet-head"><span class="src">${esc(m.comp)} ${esc(m.round)}</span>
        <button class="icon-btn" data-act="close">閉じる</button></div>
      <div class="player-wrap">
        <div class="player" id="player" style="--home:${h1};--away:${a1}">
          <div class="yt-box" id="ytBox"><div id="yt"></div></div>
          <button class="play-btn" data-act="play" id="playBtn"><span>▶ 再生する</span></button>
        </div>
      </div>
      <div class="yt-full" aria-hidden="true"><div id="ytFull"></div></div>
      <div class="team">${badge(m.home)}<span class="team-name">${esc(m.home.name)}</span></div>
      <div class="team">${badge(m.away)}<span class="team-name">${esc(m.away.name)}</span></div>
      ${jpLabels(m)}
      <div class="sheet-actions">
        <span class="src" style="margin-right:auto;align-self:center">提供: ${esc(m.src)}(YouTube)</span>
        <button class="icon-btn full-btn" data-act="full">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          全画面で再生
        </button>
      </div>
      <div class="comments">
        <button class="secondary" data-act="comments" id="cBtn">${commentsLabel(m)}</button>
        <div id="cPanel" hidden></div>
      </div>`;
    comments = null;
    sheet.dataset.id = m.id;
    sheet.classList.add('tall');
    sheet.scrollTop = 0;
    openedAt = Date.now();
    wrap.classList.add('open');
    preparePlayer(m.id);
  }

  function closeSheet() {
    clearTimeout(fallbackTimer);
    pending = null;
    playerReady = false;
    fullReady = false;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    if (player && player.destroy) player.destroy();
    if (fullPlayer && fullPlayer.destroy) fullPlayer.destroy();
    player = null;
    fullPlayer = null;
    wrap.classList.remove('open');
    sheet.classList.remove('tall');
    sheet.innerHTML = '';
    render();
  }

  // YouTubeの公式プレイヤーは、試合を開いた時点で「見えない状態」で準備しておく(サムネイルは見せない)。
  // 再生ボタンを押した瞬間に音ありで再生を指示する。iPhoneに止められたときだけ音なしで始める
  let ytReady = null;
  function loadYT() {
    if (ytReady) return ytReady;
    ytReady = new Promise((resolve) => {
      window.onYouTubeIframeAPIReady = () => resolve(window.YT);
      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    });
    return ytReady;
  }

  let playerReady = false;
  // 全画面専用のプレイヤー。iPhoneでは「画面内で再生しない」設定にすると、再生と同時にiPhone標準の
  // 全画面プレーヤーに切り替わり、YouTubeのタイトル(ネタバレ入り)が表示されない
  let fullPlayer = null;
  let fullReady = false;
  const isIPhone = /iPhone|iPod/.test(navigator.userAgent);
  let pending = null; // 準備が終わる前に押されたときの再生予約 { at }
  let fallbackTimer = null;
  const noCaptions = (p) => { try { p.unloadModule('captions'); p.unloadModule('cc'); } catch {} };

  // 再生前・再生後は、プレイヤーを見えなくして自前の再生ボタンを出す(サムネイルやおすすめ動画を見せない)
  function showCover(label) {
    document.getElementById('ytBox')?.classList.remove('on');
    const btn = document.getElementById('playBtn');
    if (btn) { btn.hidden = false; btn.innerHTML = `<span>${label}</span>`; }
  }
  function hideCover() {
    document.getElementById('ytBox')?.classList.add('on');
    const btn = document.getElementById('playBtn');
    if (btn) btn.hidden = true;
  }
  const coverShown = () => !document.getElementById('ytBox')?.classList.contains('on');

  async function preparePlayer(id) {
    playerReady = false;
    const YT = await loadYT();
    // 準備中に画面が閉じられた・別の試合に切り替わった場合は何もしない
    if (!wrap.classList.contains('open') || sheet.dataset.id !== id || !document.getElementById('yt')) return;
    player = new YT.Player('yt', {
      videoId: id,
      playerVars: { playsinline: 1, rel: 0, cc_load_policy: 0 },
      events: {
        onReady: (e) => {
          playerReady = true;
          noCaptions(e.target);
          renderComments(); // 動画の長さが分かったので、コメントの時間リンクを付け直す
          if (pending) { const p = pending; pending = null; startPlayback(p.at); }
        },
        // 字幕は最初から出さない(字幕の機能が読み込まれたら外す)
        onApiChange: (e) => noCaptions(e.target),
        onStateChange: (e) => {
          const S = YT.PlayerState;
          if (e.data === S.PLAYING || e.data === S.BUFFERING) clearTimeout(fallbackTimer);
          if (e.data === S.PLAYING) { watched.add(id); saveWatched(); }
          // 終わったらすぐプレイヤーを隠す(おすすめ動画に他の試合の結果が出るのを防ぐ)。
          // 画面は開いたままにして、続けてコメントを読めるようにする
          if (e.data === S.ENDED) showCover('▶ もう一度再生');
        },
      },
    });
    fullReady = false;
    fullPlayer = new YT.Player('ytFull', {
      videoId: id,
      playerVars: { playsinline: 0, rel: 0, cc_load_policy: 0 },
      events: {
        onReady: (e) => { fullReady = true; noCaptions(e.target); },
        onApiChange: (e) => noCaptions(e.target),
        onStateChange: (e) => {
          const S = YT.PlayerState;
          if (e.data === S.PLAYING) { watched.add(id); saveWatched(); }
          // iPad・Macの全画面で最後まで見たら、おすすめ動画が出る前に全画面を抜ける
          if (e.data === S.ENDED && document.fullscreenElement) document.exitFullscreen().catch(() => {});
        },
      },
    });
  }

  // 全画面で再生(画面内のプレイヤーで途中まで見ていたら、その続きから)
  function startFullscreen() {
    if (!fullPlayer || !fullReady) { startPlayback(); return; } // 準備が間に合わないときは普通に再生
    let from = 0;
    if (player && playerReady && !coverShown()) {
      from = player.getCurrentTime() || 0;
      player.pauseVideo();
    }
    if (from > 1) fullPlayer.seekTo(from, true);
    if (!isIPhone) {
      // iPad・Macは全画面の仕組みでプレイヤーを画面いっぱいにする(iPhoneは再生と同時に自動で全画面になる)
      const frame = fullPlayer.getIframe();
      const req = frame.requestFullscreen || frame.webkitRequestFullscreen;
      if (req) Promise.resolve(req.call(frame)).catch(() => {});
    }
    fullPlayer.unMute();
    fullPlayer.playVideo();
  }
  // iPad・Macで全画面を抜けたら、全画面用のプレイヤーは止める
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && fullPlayer && fullReady) fullPlayer.pauseVideo();
  });

  // 再生する(at を指定するとその秒から)。ボタンを押した流れのまま呼ぶので、iPhoneでも音ありで流れやすい
  function startPlayback(at = null) {
    if (!player || !playerReady) {
      pending = { at };
      showCover('読み込み中…');
      return;
    }
    hideCover();
    if (at != null) player.seekTo(at, true);
    player.unMute();
    player.playVideo();
    clearTimeout(fallbackTimer);
    // iPhoneが音ありの再生を止めたときは、音なしで始める(音はプレイヤーのミュート解除で)
    fallbackTimer = setTimeout(() => {
      const s = player?.getPlayerState?.();
      if (player && s !== YT.PlayerState.PLAYING && s !== YT.PlayerState.BUFFERING) { player.mute(); player.playVideo(); }
    }, 900);
  }

  // コメントの時間リンクから、その時点へ移動して再生。
  // 移動するとYouTubeのプレイヤーが4秒ほど操作ボタンを表示するので、4秒前から流して場面が隠れないようにする
  const LEAD_SECONDS = 4;
  function seekTo(at) {
    const from = Math.max(0, at - LEAD_SECONDS);
    if (coverShown()) { startPlayback(from); return; }
    player.seekTo(from, true);
    player.playVideo();
  }

  // ---- コメント(自動更新のたびに集めたものを、ボタンを押したときだけ読み込む) ----
  const PAGE = 20;
  let comments = null; // { id, data, order, shown }
  const commentsLabel = (m) => `コメントを表示${m.commentCount ? `(${m.commentCount.toLocaleString()}件)` : ''}`;
  const ago = (iso) => {
    const min = Math.max(0, (Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 60) return `${Math.floor(min)}分前`;
    if (min < 1440) return `${Math.floor(min / 60)}時間前`;
    return `${Math.floor(min / 1440)}日前`;
  };
  const hhmm = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };

  async function toggleComments() {
    const panel = document.getElementById('cPanel'), btn = document.getElementById('cBtn');
    const m = DATA.matches.find((x) => x.id === sheet.dataset.id);
    if (!panel.hidden) { panel.hidden = true; btn.textContent = commentsLabel(m); return; }
    panel.hidden = false;
    btn.textContent = 'コメントを隠す';
    if (!comments || comments.id !== m.id) {
      panel.innerHTML = '<p class="note muted">読み込み中…</p>';
      let data = null;
      try {
        const res = await fetch(`comments/${m.id}.json?t=${Math.floor(Date.now() / 60000)}`);
        if (res.ok) data = await res.json();
      } catch {}
      comments = { id: m.id, data, order: 'top', shown: PAGE };
    }
    renderComments();
  }

  // コメント中の「1:23」「1:02:03」を、その時点から再生するリンクにする(動画の長さを超える時間はリンクにしない)
  const TIME_RE = /(^|[^\d:])((?:(\d{1,2}):)?(\d{1,2}):(\d{2}))(?![\d:])/g;
  function timeLinks(escaped, duration) {
    return escaped.replace(TIME_RE, (all, pre, t, h, mm, ss) => {
      const sec = (Number(h) || 0) * 3600 + Number(mm) * 60 + Number(ss);
      if (Number(ss) >= 60 || (h && Number(mm) >= 60) || sec > (duration || 1800)) return all;
      return `${pre}<button class="ts" data-act="seek" data-t="${sec}">${t}</button>`;
    });
  }

  function renderComments() {
    const panel = document.getElementById('cPanel');
    if (!panel || panel.hidden || !comments) return;
    const duration = playerReady && player?.getDuration ? player.getDuration() : 0;
    const d = comments.data;
    if (!d) { panel.innerHTML = '<p class="note muted">コメントを読み込めませんでした。公開されたばかりの動画は、次の自動更新(最大30分)のあとに見られます。</p>'; return; }
    if (d.disabled) { panel.innerHTML = '<p class="note muted">この動画はコメントがオフになっています。</p>'; return; }
    const list = d[comments.order] || [];
    const seg = (key, label) => `<button data-act="corder" data-o="${key}" aria-pressed="${comments.order === key}">${label}</button>`;
    panel.innerHTML = `
      <div class="cm-bar"><div class="seg">${seg('top', '人気順')}${seg('new', '新しい順')}</div>
        <span class="cm-meta">YouTubeのコメント ・ ${hhmm(d.fetchedAt)}時点</span></div>
      ${list.length ? '' : '<p class="note muted">まだコメントはありません。</p>'}
      ${list.slice(0, comments.shown).map((c) => `
        <div class="cm"><div class="cm-head"><span class="cm-author">${esc(c.a)}</span><span>${ago(c.p)}</span>
          ${c.l ? `<span>いいね ${c.l.toLocaleString()}</span>` : ''}${c.r ? `<span>返信 ${c.r}</span>` : ''}</div>
          <div class="cm-text">${timeLinks(esc(c.t), duration)}</div></div>`).join('')}
      ${list.length > comments.shown ? '<button class="secondary" data-act="cmore">もっと見る</button>' : ''}`;
  }

  // ---- 通知の設定 ----
  const SECRET_URL = 'https://github.com/taco-05/highlights/settings/secrets/actions/new';
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const keyBytes = (b64u) => Uint8Array.from(atob(b64u.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));

  async function openNotifySheet(message = '') {
    let body = '<p class="note">7時・11時・16時に、新しく届いたハイライトをまとめてお知らせします。お知らせにはチーム名だけを書き、結果は書きません。</p>';
    if (isIOS && !isStandalone) {
      body += `<p class="note">iPhone・iPadで通知を受け取るには、先にホーム画面に追加してください。</p>
        <ol class="steps">
          <li>Safariの下にある<b>共有ボタン</b>(□に↑のマーク)を押す</li>
          <li><b>「ホーム画面に追加」</b>を選び、「追加」を押す</li>
          <li>ホーム画面の<b>「.Highlight」</b>アイコンから開き、もう一度右上の<b>ベルのボタン</b>を押す</li>
        </ol>`;
    } else if (!pushSupported) {
      body += '<p class="note">この画面では通知が使えません。</p>';
    } else {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (!sub || Notification.permission !== 'granted') {
        body += '<button class="primary" data-act="subscribe">通知をオンにする</button>';
      } else {
        body += `<p class="note"><span class="ok">✓ この端末の通知はオンです</span></p>
          <p class="note">最後に、下の<b>登録コード</b>をGitHubに登録すると通知が届くようになります(最初の1回だけ)。</p>
          <ol class="steps">
            <li>「コードをコピー」を押す</li>
            <li>「GitHubの登録ページを開く」を押す</li>
            <li><b>Name</b> に <code>PUSH_SUBSCRIPTION</code>、<b>Secret</b> にコピーしたコードを貼り付けて「Add secret」</li>
          </ol>
          <div class="code" id="subCode">${esc(JSON.stringify(sub))}</div>
          <button class="primary" data-act="copy">コードをコピー</button>
          <a class="secondary" href="${SECRET_URL}" target="_blank" rel="noopener">GitHubの登録ページを開く</a>`;
      }
    }
    sheet.innerHTML = `<div class="sheet-head"><strong>通知の設定</strong><button class="icon-btn" data-act="close">閉じる</button></div>
      ${message ? `<p class="note">${message}</p>` : ''}${body}`;
    sheet.dataset.id = '';
    sheet.classList.remove('tall');
    openedAt = Date.now();
    wrap.classList.add('open');
  }

  async function subscribe() {
    // iPhoneでは、ボタンを押した直後に許可を求める必要がある
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      openNotifySheet('通知が許可されませんでした。iPhoneの「設定」→「通知」→「.Highlight」から許可できます。');
      return;
    }
    try {
      const reg = await navigator.serviceWorker.ready;
      await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(window.PUSH_PUBLIC_KEY) });
      openNotifySheet();
    } catch (err) {
      openNotifySheet(`通知の登録に失敗しました(${esc(err.message || err)})`);
    }
  }

  // ---- 一覧のスワイプで「見た/未視聴」を切り替え(メールアプリのような動き) ----
  const SWIPE_DISTANCE = 72;
  const listEl = document.getElementById('list');
  let drag = null;
  let suppressClick = false; // スワイプの直後に試合が開いてしまわないように
  listEl.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.card');
    if (!c || (e.pointerType === 'mouse' && e.button !== 0)) return;
    drag = { card: c, bg: c.previousElementSibling, x: e.clientX, y: e.clientY, dx: 0, moving: false, pid: e.pointerId };
  });
  listEl.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moving) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; } // 縦のスクロールは邪魔しない
      if (Math.abs(dx) < 10) return;
      drag.moving = true;
      drag.card.classList.add('dragging');
      try { drag.card.setPointerCapture(e.pointerId); } catch {}
    }
    drag.dx = dx;
    drag.card.style.transform = `translateX(${dx}px)`;
    drag.bg.classList.toggle('left', dx < 0);
    drag.bg.classList.toggle('ready', Math.abs(dx) >= SWIPE_DISTANCE);
  });
  const endDrag = (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    const { card: c, bg, dx, moving } = drag;
    drag = null;
    if (!moving) return;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 400);
    c.classList.remove('dragging');
    c.style.transform = '';
    // 途中で中断された(スクロールに切り替わった等)ときは切り替えず、元に戻すだけ
    if (e.type === 'pointerup' && Math.abs(dx) >= SWIPE_DISTANCE) {
      const id = c.dataset.id;
      watched.has(id) ? watched.delete(id) : watched.add(id);
      saveWatched();
      setTimeout(render, 220);
    } else {
      bg.classList.remove('ready', 'left');
    }
  };
  listEl.addEventListener('pointerup', endDrag);
  listEl.addEventListener('pointercancel', endDrag);

  document.addEventListener('click', (e) => {
    if (suppressClick && e.target.closest('.card')) return;
    const chip = e.target.closest('.chip');
    if (chip) { filter = chip.dataset.f; store.set('filter', filter); renderChips(); render(); return; }
    const c = e.target.closest('.card');
    if (c) { openSheet(DATA.matches.find((m) => m.id === c.dataset.id)); return; }
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'close') closeSheet();
    if (act === 'play') startPlayback();
    if (act === 'seek') seekTo(Number(e.target.closest('[data-t]').dataset.t));
    if (act === 'notify') openNotifySheet();
    if (act === 'subscribe') subscribe();
    if (act === 'copy') {
      const btn = e.target;
      navigator.clipboard.writeText(document.getElementById('subCode').textContent)
        .then(() => { btn.textContent = '✓ コピーしました'; })
        .catch(() => { btn.textContent = 'コピーできませんでした。コードを長押ししてコピーしてください'; });
    }
    if (act === 'comments') toggleComments();
    if (act === 'corder') { comments.order = e.target.closest('[data-o]').dataset.o; comments.shown = PAGE; renderComments(); }
    if (act === 'cmore') { comments.shown += PAGE; renderComments(); }
    if (act === 'full') startFullscreen();
    if (e.target === wrap && Date.now() - openedAt > 500) closeSheet();
  });
  unwatchedBox.addEventListener('change', () => { store.set('unwatchedOnly', unwatchedBox.checked); render(); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  renderChips();
  render();
  const upd = new Date(DATA.generatedAt);
  document.getElementById('footer').innerHTML =
    `最終更新 ${upd.getMonth() + 1}/${upd.getDate()} ${String(upd.getHours()).padStart(2, '0')}:${String(upd.getMinutes()).padStart(2, '0')} ・ ${DATA.matches.length}試合`
    + '<br>試合を左右にスワイプすると、見た/未視聴を切り替えられます';
})();
</script>
</body>
</html>
